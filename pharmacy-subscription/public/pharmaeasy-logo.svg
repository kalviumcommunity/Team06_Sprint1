<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 55" width="200" height="55">
  <defs>
    <linearGradient id="pharmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  
  <!-- Organic Leaf & Swirl Ring -->
  <g transform="translate(2, 2)">
    <!-- Outer Swirl Arc -->
    <path d="M 26 3 A 22 22 0 1 1 6 22" fill="none" stroke="url(#pharmaGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 44 14 A 20 20 0 0 1 32 44" fill="none" stroke="url(#pharmaGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Medical Cross -->
    <path d="M 21 13 H 29 V 21 H 37 V 29 H 29 V 37 H 21 V 29 H 13 V 21 H 21 Z" fill="none" stroke="url(#pharmaGrad)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Center Leaf Drop -->
    <path d="M 25 19 C 21 24, 21 28, 25 31 C 29 28, 29 24, 25 19 Z" fill="url(#pharmaGrad)" />
    
    <!-- Small Leaf Accent -->
    <path d="M 33 11 C 36 8, 40 9, 39 13 C 36 14, 33 13, 33 11 Z" fill="url(#pharmaGrad)" />
  </g>
  
  <!-- Text Branding -->
  <text x="60" y="27" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">PharmEasy</text>
  <text x="60" y="44" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b">Orders Page</text>
</svg>
